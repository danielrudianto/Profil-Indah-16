<h1 mat-dialog-title>Delete confirmation</h1>
<mat-dialog-content>
  <p>{{ data.title }}</p>
  <p>{{ data.document }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button
    mat-raised-button
    color="primary"
    mat-dialog-close
    (click)="deleteDocument()"
  >
    Delete
  </button>
</mat-dialog-actions>
