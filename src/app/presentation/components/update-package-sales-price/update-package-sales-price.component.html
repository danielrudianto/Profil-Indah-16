<form [formGroup]="priceFormGroup" class="mt-3">
  <h1>
    {{ "update-package-sales-price__title" | translate }}
  </h1>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>
      {{ "update-product-sales-price__price" | translate }}</mat-label
    >
    <input
      matInput
      type="text"
      mask="separator.2"
      thousandSeparator=" "
      formControlName="price"
      placeholder="Ex. 8 000"
    />
  </mat-form-field>

  <!-- Slide toggle, disabled if initialPrice is same with price -->
  <mat-slide-toggle
    class="w-100"
    formControlName="save_price"
    [disabled]="
      priceFormGroup.controls['initial_price'].value ===
        priceFormGroup.controls['price'].value || priceFormGroup.invalid
    "
  >
    {{ "update-product-sales-price__save-price" | translate }}
  </mat-slide-toggle>

  <!-- Button to save -->
  <div class="update-price__button-wrapper">
    <button
      [disabled]="priceFormGroup.invalid"
      class="button-default"
      (click)="updatePrice()"
    >
      {{ "update-product-sales-price__save" | translate }}
    </button>
  </div>
</form>
