<app-dynamic-dialog (backgroundClick)="closeDialog()" [isOpened]="isOpened">
  <div class="create-dialog">
    <app-dialog-header
      [title]="'product-selector__title' | translate"
      (onDialogClose)="closeDialog()"
    />
    <div class="create-dialog__content">
      <form [formGroup]="searchItemFormGroup">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>{{ "product-selector__search" | translate }}</mat-label>
          <input
            matInput
            type="text"
            placeholder="Ex. TH-001AA"
            [readOnly]="isLoading"
            formControlName="searchBar"
          />
        </mat-form-field>
      </form>

      <div *ngIf="isLoading">
        <mat-spinner id="spinner"></mat-spinner>
      </div>

      <div *ngIf="!isLoading" class="item-selector__wrapper">
        <div
          class="item-selector__item-wrapper"
          *ngFor="let element of dataSource"
        >
          <div class="item-selector__reference">{{ element.reference }}</div>
          <div class="item-selector__description">
            {{ element.description }}
          </div>
          <div class="item-selector__unit-wrapper">
            <div
              class="item-selector__unit"
              (click)="selectItem({ item: element, price: null })"
            >
              <div class="item-selector__unit-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                  <g
                    id="SVGRepo_tracerCarrier"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></g>
                  <g id="SVGRepo_iconCarrier">
                    <path
                      opacity="0.4"
                      d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
                      fill="#5985e1"
                    ></path>
                    <path
                      d="M16 11.25H12.75V8C12.75 7.59 12.41 7.25 12 7.25C11.59 7.25 11.25 7.59 11.25 8V11.25H8C7.59 11.25 7.25 11.59 7.25 12C7.25 12.41 7.59 12.75 8 12.75H11.25V16C11.25 16.41 11.59 16.75 12 16.75C12.41 16.75 12.75 16.41 12.75 16V12.75H16C16.41 12.75 16.75 12.41 16.75 12C16.75 11.59 16.41 11.25 16 11.25Z"
                      fill="#5985e1"
                    ></path>
                  </g>
                </svg>
              </div>
              <div class="item-selector__unit-text">{{ element.unit }}</div>
            </div>
            <div
              (click)="selectItem({ item: element, price: data })"
              class="item-selector__unit"
              *ngFor="let data of element.unit_price"
            >
              <div class="item-selector__unit-icon">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                  <g
                    id="SVGRepo_tracerCarrier"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  ></g>
                  <g id="SVGRepo_iconCarrier">
                    <path
                      opacity="0.4"
                      d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
                      fill="#5985e1"
                    ></path>
                    <path
                      d="M16 11.25H12.75V8C12.75 7.59 12.41 7.25 12 7.25C11.59 7.25 11.25 7.59 11.25 8V11.25H8C7.59 11.25 7.25 11.59 7.25 12C7.25 12.41 7.59 12.75 8 12.75H11.25V16C11.25 16.41 11.59 16.75 12 16.75C12.41 16.75 12.75 16.41 12.75 16V12.75H16C16.41 12.75 16.75 12.41 16.75 12C16.75 11.59 16.41 11.25 16 11.25Z"
                      fill="#5985e1"
                    ></path>
                  </g>
                </svg>
              </div>
              <div class="item-selector__unit-text">
                {{ data.unit }} ({{ data.conversion | number : "0.0-2" }}
                {{ element.unit }})
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="create-dialog__footer">
      <mat-paginator
        class="paginator"
        [pageIndex]="page - 1"
        [length]="dataCount"
        [pageSize]="10"
        (page)="changePage($event)"
        aria-label="Select page"
        hidePageSize="true"
        *ngIf="!isLoading"
      >
      </mat-paginator>
    </div>
  </div>
</app-dynamic-dialog>
