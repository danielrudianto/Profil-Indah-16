<form [formGroup]="priceFormGroup" class="mt-3">
  <h1>Update product purchase price</h1>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Price</mat-label>
    <input
      type="text"
      matInput
      mask="separator.2"
      thousandSeparator=" "
      (focus)="setFocus('price')"
      (blur)="unsetFocus()"
      placeholder="Ex. 8 000"
      formControlName="price"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Discount (Rp.)</mat-label>
    <input
      type="text"
      matInput
      mask="separator.2"
      thousandSeparator=" "
      placeholder="Ex. 800"
      (focus)="setFocus('absolute')"
      formControlName="discount"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Discount (%)</mat-label>
    <input
      type="text"
      matInput
      mask="separator.2"
      thousandSeparator=" "
      placeholder="Ex. 800"
      (focus)="setFocus('percentage')"
      (blur)="unsetFocus()"
      formControlName="discountPercentage"
    />
  </mat-form-field>

  <!-- Slide toggle, disabled if initialPrice is same with price -->
  <mat-slide-toggle
    class="w-100"
    formControlName="save_price"
    [disabled]="
      (priceFormGroup.controls['initial_price'].value ===
        priceFormGroup.controls['price'].value &&
        this.priceFormGroup.controls['initial_discount'].value ===
          this.priceFormGroup.controls['discount'].value) ||
      priceFormGroup.invalid
    "
  >
    Save price
  </mat-slide-toggle>
</form>

<button
  class="action-button"
  (click)="saveSheet()"
  [disabled]="!priceFormGroup.valid"
>
  Save
</button>
