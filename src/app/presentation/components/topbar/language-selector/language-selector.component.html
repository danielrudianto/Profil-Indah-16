<!-- Create 2 options between Indonesian (ID) and English (EN), symbolize using flags -->
<button mat-icon-button [matMenuTriggerFor]="languageMenu">
  <svg
    *ngIf="currentLang == 'id'"
    viewBox="0 0 64 64"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    aria-hidden="true"
    role="img"
    class="iconify iconify--emojione"
    preserveAspectRatio="xMidYMid meet"
    fill="#000000"
  >
    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
    <g
      id="SVGRepo_tracerCarrier"
      stroke-linecap="round"
      stroke-linejoin="round"
    ></g>
    <g id="SVGRepo_iconCarrier">
      <path
        d="M31.8 62c16.6 0 30-13.4 30-30h-60c0 16.6 13.4 30 30 30"
        fill="#f9f9f9"
      ></path>
      <path
        d="M31.8 2c-16.6 0-30 13.4-30 30h60c0-16.6-13.4-30-30-30"
        fill="#ed4c5c"
      ></path>
    </g>
  </svg>

  <svg
    *ngIf="currentLang == 'en'"
    version="1.1"
    id="Layer_1"
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 512 512"
    xml:space="preserve"
    fill="#000000"
  >
    <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
    <g
      id="SVGRepo_tracerCarrier"
      stroke-linecap="round"
      stroke-linejoin="round"
    ></g>
    <g id="SVGRepo_iconCarrier">
      <circle style="fill: #f0f0f0" cx="256" cy="256" r="256"></circle>
      <path
        style="fill: #d80027"
        d="M509.833,222.609h-220.44h-0.001V2.167C278.461,0.744,267.317,0,256,0s-22.461,0.744-33.391,2.167 v220.44v0.001H2.167C0.744,233.539,0,244.681,0,256c0,11.319,0.744,22.461,2.167,33.391h220.44h0.001v220.442 C233.539,511.256,244.683,512,256,512s22.461-0.743,33.391-2.167v-220.44v-0.001h220.442C511.256,278.461,512,267.319,512,256 C512,244.681,511.256,233.539,509.833,222.609z"
      ></path>
    </g>
  </svg>
</button>

<mat-menu #languageMenu="matMenu">
  <button
    mat-menu-item
    class="language__menu-item"
    (click)="changeLanguage('id')"
  >
    <svg
      viewBox="0 0 64 64"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      aria-hidden="true"
      role="img"
      class="iconify iconify--emojione"
      preserveAspectRatio="xMidYMid meet"
      fill="#000000"
    >
      <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
      <g
        id="SVGRepo_tracerCarrier"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></g>
      <g id="SVGRepo_iconCarrier">
        <path
          d="M31.8 62c16.6 0 30-13.4 30-30h-60c0 16.6 13.4 30 30 30"
          fill="#f9f9f9"
        ></path>
        <path
          d="M31.8 2c-16.6 0-30 13.4-30 30h60c0-16.6-13.4-30-30-30"
          fill="#ed4c5c"
        ></path>
      </g>
    </svg>
    Bahasa
  </button>
  <button
    mat-menu-item
    class="language__menu-item"
    (click)="changeLanguage('en')"
  >
    <svg
      height="200px"
      width="200px"
      version="1.1"
      id="Layer_1"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      viewBox="0 0 512 512"
      xml:space="preserve"
      fill="#000000"
    >
      <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
      <g
        id="SVGRepo_tracerCarrier"
        stroke-linecap="round"
        stroke-linejoin="round"
      ></g>
      <g id="SVGRepo_iconCarrier">
        <circle style="fill: #f0f0f0" cx="256" cy="256" r="256"></circle>
        <path
          style="fill: #d80027"
          d="M509.833,222.609h-220.44h-0.001V2.167C278.461,0.744,267.317,0,256,0s-22.461,0.744-33.391,2.167 v220.44v0.001H2.167C0.744,233.539,0,244.681,0,256c0,11.319,0.744,22.461,2.167,33.391h220.44h0.001v220.442 C233.539,511.256,244.683,512,256,512s22.461-0.743,33.391-2.167v-220.44v-0.001h220.442C511.256,278.461,512,267.319,512,256 C512,244.681,511.256,233.539,509.833,222.609z"
        ></path>
      </g>
    </svg>
    English
  </button>
</mat-menu>
