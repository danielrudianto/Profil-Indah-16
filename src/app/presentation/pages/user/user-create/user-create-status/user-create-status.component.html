<h2 mat-dialog-title>Create user status</h2>
<div mat-dialog-content>
  <mat-form-field appearance="outline" class="w-100 mt-2">
    <mat-label>Name</mat-label>
    <input matInput [value]="data.name" readonly />
  </mat-form-field>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Username</mat-label>
    <input matInput [value]="data.username" readonly />
  </mat-form-field>

  <mat-form-field class="w-100" appearance="outline">
    <mat-label>NIK</mat-label>
    <input
      matInput
      type="text"
      minlength="16"
      maxlength="16"
      [value]="data.nik"
    />
  </mat-form-field>
  <mat-form-field class="w-100" appearance="outline">
    <mat-label>Role</mat-label>
    <input matInput [value]="data.role" readonly />
  </mat-form-field>

  <mat-form-field class="w-100" appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput [value]="data.password" readonly />
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="copyUserInfo()">Copy</button>
  <button mat-button mat-dialog-close>Close</button>
</div>
