<app-feature-background />
<div class="container">
  <div class="row">
    <div class="col-12">
      <app-feature-header
        title="Package"
        help="Here you can manage your package deals. Package deals has it's own price."
        [isBackAvailable]="true"
      ></app-feature-header>
      <div class="dashboard-card">
        <app-feature-search
          [addButton]="true"
          route="product-package"
          [page]="page"
          [enable]="true"
          (onChange)="onUpdateData($event)"
          (onLoadingChange)="onUpdateLoadingStatus($event)"
          (updatePage)="onUpdatePage()"
          (onNewQuery)="page = 1"
        ></app-feature-search>
        <div class="table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th class="text-center">Reference</th>
                <th class="text-center">Description</th>
                <th class="text-center">Brand</th>
                <th class="text-center">Type</th>
                <th class="text-center">Status</th>
                <th class="text-center">Action</th>
              </tr>
            </thead>
            <tbody *ngIf="!isLoading && dataSource.length > 0">
              <tr *ngFor="let item of dataSource">
                <td>{{ item.reference }}</td>
                <td>
                  <span class="text-clamp-2">
                    {{ item.description }}
                  </span>
                </td>
                <td class="text-center">{{ item.item_brand_name }}</td>
                <td class="text-center">{{ item.item_type_name }}</td>
                <td class="text-center">
                  <span *ngIf="item.is_active">Active</span>
                  <span *ngIf="!item.is_active">Inactive</span>
                </td>
                <td class="text-center">
                  <button mat-icon-button [matMenuTriggerFor]="menu">
                    <mat-icon>more_vert</mat-icon>
                  </button>
                  <mat-menu #menu="matMenu">
                    <button (click)="openDialog('edit', item.id)" mat-menu-item>
                      <mat-icon>edit</mat-icon>
                      <span>Edit</span>
                    </button>
                    <button
                      (click)="openDialog('edit-unit', item.id)"
                      mat-menu-item
                    >
                      <mat-icon>dataset</mat-icon>
                      <span>Edit unit</span>
                    </button>
                    <button
                      mat-menu-item
                      (click)="openDialog('active', item.id)"
                    >
                      <mat-icon *ngIf="item.is_active">toggle_on</mat-icon>
                      <mat-icon *ngIf="!item.is_active">toggle_off</mat-icon>

                      <span
                        >Set product as
                        <span *ngIf="item.is_active">in</span>active</span
                      >
                    </button>
                    <button
                      [class.delete-button]="item.can_delete"
                      mat-menu-item
                      (click)="openDialog('delete', item.id)"
                      [disabled]="!(item.can_delete && isAdministrator)"
                    >
                      <mat-icon>delete</mat-icon>
                      <span>Delete</span>
                    </button>
                  </mat-menu>
                </td>
              </tr>
            </tbody>
            <tbody *ngIf="!isLoading && dataSource.length == 0"></tbody>
            <tbody *ngIf="isLoading">
              <tr>
                <td colspan="6" class="text-center">
                  <mat-spinner id="spinner"></mat-spinner>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <mat-paginator
          class="paginator"
          [pageIndex]="page - 1"
          [length]="dataCount"
          [pageSize]="10"
          (page)="changePage($event)"
          aria-label="Select page"
          hidePageSize="true"
          *ngIf="!isLoading"
        >
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
