<app-dynamic-dialog (backgroundClick)="closeDialog()" [isOpened]="isOpened">
  <div class="create-dialog">
    <app-dialog-header title="Inventory report" (onDialogClose)="closeDialog()">
    </app-dialog-header>
    <div class="create-dialog__content">
      <h6>Current inventory value</h6>
      <p [countUp]="value" [duration]="300"></p>
      <mat-divider></mat-divider>
      <div class="list-item" *ngFor="let c of company; index as i">
        <app-circle-avatar [name]="c.name[0] | uppercase" />
        <div class="list-item__text-wrapper">
          <h5>{{ c.name }}</h5>
          <p class="text-clamp-1">Rp.&nbsp;{{ c.value | number : "0.2-2" }}</p>
        </div>
      </div>
    </div>
  </div>
  <div class="create-dialog__footer">
    <button
      class="action-button mt-5"
      [disabled]="isDownloading"
      (click)="download()"
    >
      Download report
    </button>
  </div>
</app-dynamic-dialog>
