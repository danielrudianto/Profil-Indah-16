<div class="dashboard__wrapper">
  <div class="dashboard__wrapper-background">
    <img src="/assets/images/hero_left.png" class="dashboard__hero left" />
    <img src="/assets/images/hero_right.png" class="dashboard__hero right" />
  </div>

  <div class="dashboard__menu-wrapper container">
    <div class="row">
      <div class="col-12">
        <h3>Available Dashboards</h3>
      </div>
      <div
        class="col-xl-3 col-lg-4 col-md-6 col-sm-10 col-12"
        *ngFor="let d of dashboard"
      >
        <app-dashboard-card
          [title]="d.title"
          [description]="d.description"
          [route]="d.route"
        />
      </div>
    </div>
  </div>
</div>
