<div class="dashboard__wrapper">
  <div class="dashboard__wrapper-background">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12" id="get-started">
          <img src="/assets/images/get-started.png" class="dashboard__hero" />
          <div class="get-started__text-box px-3">
            <h1>{{ "dashboard-administrator__hero" | translate }}</h1>
            <p>{{ "dashboard-administrator__description" | translate }}</p>
            <div class="get-started__text-box__button-wrapper">
              <button
                class="download-button"
                [matTooltip]="
                  'dashboard-administrator__download-mobile-application'
                    | translate
                "
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  height="30px"
                  viewBox="0 -960 960 960"
                  width="30px"
                >
                  <path
                    d="M236-345 100-480l440-440h271L236-345ZM540-40 303-277l237-237h271L574-277 811-40H540Z"
                  />
                </svg>
              </button>
              <button
                class="download-button"
                (click)="goToStockApplication()"
                [matTooltip]="
                  'dashboard-administrator__navigate-stock-application'
                    | translate
                "
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  height="30px"
                  viewBox="0 -960 960 960"
                  width="30px"
                  fill="#e8eaed"
                >
                  <path
                    d="M200-80q-33 0-56.5-23.5T120-160v-451q-18-11-29-28.5T80-680v-120q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v120q0 23-11 40.5T840-611v451q0 33-23.5 56.5T760-80H200Zm0-520v440h560v-440H200Zm-40-80h640v-120H160v120Zm200 280h240v-80H360v80Zm120 20Z"
                  />
                </svg>
              </button>
              <div class="vertical-divider mx-2"></div>
              <button
                class="download-button white"
                [matTooltip]="
                  'dashboard-administrator__back-to-home' | translate
                "
                [routerLink]="'/'"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  height="24px"
                  viewBox="0 -960 960 960"
                  width="24px"
                >
                  <path
                    d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"
                  />
                </svg>
              </button>
            </div>
            <small>{{
              "dashboard-administrator__other-application" | translate
            }}</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="container">
  <div class="row">
    <div class="col-12">
      <mat-grid-list
        [cols]="columnNumber"
        [rowHeight]="aspectRatio"
        class="w-100"
        gutterSize="20"
        class="grid-list"
      >
        <mat-grid-tile *ngFor="let stat of stats">
          <app-stat-card
            class="w-100 h-100"
            [previousValue]="stat.previousValue"
            [title]="stat.title | translate"
            [value]="stat.value"
            [againstText]="
              stat.againstText == undefined
                ? undefined
                : (stat.againstText | translate)
            "
          />
        </mat-grid-tile>
      </mat-grid-list>
    </div>
  </div>
</div>
