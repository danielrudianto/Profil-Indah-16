<h2 mat-dialog-title>{{ "payment-method__update__title" | translate }}</h2>
<form [formGroup]="paymentMethodFormGroup" (ngSubmit)="submitForm()">
  <mat-dialog-content>
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>{{ "payment-method__add__name" | translate }}</mat-label>
      <input
        [disabled]="isSubmitting"
        matInput
        placeholder="Ex. PT. ABC"
        type="text"
        formControlName="name"
      />
    </mat-form-field>
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>{{
        "payment-method__add__description" | translate
      }}</mat-label>
      <input
        matInput
        placeholder="Ex. Rekening BCA a/n Toko Profil Indah"
        type="text"
        formControlName="description"
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      type="submit"
      mat-stroked-button
      color="primary"
      (click)="submitForm()"
      [disabled]="isSubmitting || !paymentMethodFormGroup.valid"
    >
      {{ "payment-method__add__submit" | translate }}
    </button>
  </mat-dialog-actions>
</form>
