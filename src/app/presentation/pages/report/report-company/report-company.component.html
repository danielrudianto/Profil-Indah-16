<h2 mat-dialog-title>{{ "report-company__title" | translate }}</h2>
<form [formGroup]="companyFormGroup" (ngSubmit)="downloadReport()">
  <mat-dialog-content>
    <app-autocomplete-search
      [routeName]="'company'"
      (onSelectData)="onSelectCompany($event)"
      (onUnselectData)="onUnselectCompany()"
      [label]="'report-company__company' | translate"
      [selected]="companyFormGroup.controls['company'].valid"
    />

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ "report-company__date" | translate }}</mat-label>
      <input
        matInput
        formControlName="date"
        autocomplete="off"
        [matDatepicker]="dp"
        [readonly]="isDownloading"
      />
      <mat-datepicker-toggle
        matSuffix
        [for]="dp"
        [disabled]="isDownloading"
      ></mat-datepicker-toggle>
      <mat-datepicker
        #dp
        panelClass="example-month-picker"
        [disabled]="isDownloading"
      >
      </mat-datepicker>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button
      mat-stroked-button
      color="primary"
      type="submit"
      style="letter-spacing: 0"
      [disabled]="isDownloading || !companyFormGroup.valid"
    >
      {{ "report-company__download" | translate }}
    </button>
  </mat-dialog-actions>
</form>
