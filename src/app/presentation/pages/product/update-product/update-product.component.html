<app-dynamic-dialog (backgroundClick)="closeDialog()" [isOpened]="isOpened">
  <div class="create-dialog">
    <app-dialog-header
      [title]="'product__update__title' | translate"
      (onDialogClose)="closeDialog()"
    >
    </app-dialog-header>
    <div class="create-dialog__content">
      <form [formGroup]="itemFormGroup">
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>{{ "product__add__reference" | translate }}</mat-label>
          <input
            [disabled]="isSubmitting"
            matInput
            placeholder="Ex. MLT-9-G"
            type="text"
            formControlName="reference"
          />
        </mat-form-field>
        <mat-form-field class="w-100" appearance="outline">
          <mat-label>{{ "product__add__description" | translate }}</mat-label>
          <textarea
            [disabled]="isSubmitting"
            matInput
            placeholder="Ex. Multiplek 9mm Garuda"
            type="text"
            formControlName="description"
          ></textarea>
        </mat-form-field>
        <app-autocomplete-search
          [label]="'product__add__brand' | translate"
          [defaultValue]="itemFormGroup.controls['brand_name'].value"
          [selected]="itemFormGroup.controls['brand'].valid"
          routeName="product-brand"
          (onSelectData)="onSelectBrand($event)"
          (onUnselectData)="onUnselectBrand()"
          [selected]="itemFormGroup.controls['brand'].valid"
        ></app-autocomplete-search>

        <app-autocomplete-search
          [label]="'product__add__type' | translate"
          [defaultValue]="itemFormGroup.controls['type_name'].value"
          [selected]="itemFormGroup.controls['type'].valid"
          routeName="product-type"
          (onSelectData)="onSelectType($event)"
          (onUnselectData)="onUnselectType()"
          [selected]="itemFormGroup.controls['type'].valid"
        ></app-autocomplete-search>

        <mat-form-field class="w-100" appearance="outline">
          <mat-label>{{ "product__add__unit" | translate }}</mat-label>
          <input
            [disabled]="isSubmitting"
            matInput
            placeholder="Ex. pcs"
            type="text"
            formControlName="unit"
          />
        </mat-form-field>

        <mat-form-field class="w-100" appearance="outline">
          <mat-label>{{ "product__add__minimum-stock" | translate }}</mat-label>
          <input
            [disabled]="isSubmitting"
            matInput
            placeholder="Ex. 200"
            type="text"
            mask="separator.2"
            thousandSeparator=" "
            formControlName="minimum_stock"
          />
        </mat-form-field>
      </form>
    </div>
    <div class="create-dialog__footer">
      <button
        type="button"
        class="next-button"
        (click)="submitForm()"
        [disabled]="isSubmitting || !itemFormGroup.valid"
      >
        {{ "product__add__submit" | translate }}
      </button>
    </div>
  </div>
</app-dynamic-dialog>
