<div class="header__bar"></div>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-xl-4 col-lg-6 col-md-8 col-sm-10 col-xs-10 col-12">
      <h1>Profil Indah</h1>
      <div class="card w-100 p-4">
        <div class="avatar__wrapper__border">
          <div
            class="avatar__wrapper"
            (mouseenter)="isHovered = true"
            (mouseleave)="isHovered = false"
          >
            <div class="avatar__bear">
              <div class="avatar__body">
                <img src="/assets/images/bear-body.png" />
              </div>
              <div class="avatar__eyes">
                <img
                  src="/assets/images/bear-eye-normal.png"
                  *ngIf="isSubmitting"
                />
                <img
                  src="/assets/images/bear-eye-open.png"
                  *ngIf="!isSubmitting && !isHovered"
                />
                <img
                  src="/assets/images/bear-eye-close.png"
                  *ngIf="!isSubmitting && isHovered"
                />
              </div>
            </div>
          </div>
        </div>

        <h2 class="mt-3">Sign in</h2>
        <mat-divider class="mb-3"></mat-divider>

        <form [formGroup]="loginFormGroup" (ngSubmit)="login()">
          <mat-form-field class="w-100">
            <mat-label>Username</mat-label>
            <input
              matInput
              formControlName="username"
              type="text"
              name="username"
              [readonly]="isSubmitting"
            />
          </mat-form-field>

          <mat-form-field class="w-100">
            <mat-label>Password</mat-label>
            <input
              matInput
              formControlName="password"
              [type]="isVisibilityOn ? 'text' : 'password'"
              name="password"
              [readonly]="isSubmitting"
            />
            <button
              type="button"
              matSuffix
              mat-icon-button
              aria-label="View"
              (click)="isVisibilityOn = !isVisibilityOn"
            >
              <mat-icon>{{
                isVisibilityOn ? "visibility_off" : "visibility"
              }}</mat-icon>
              <mat-icon
                *ngIf="loginFormGroup.controls['password'].value != ''"
              ></mat-icon>
            </button>
          </mat-form-field>

          <button
            [disabled]="isSubmitting || !loginFormGroup.valid"
            type="submit"
            class="button-default w-100"
          >
            Login
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
