<h2 mat-dialog-title>{{ "product__brand__add__title" | translate }}</h2>
<form [formGroup]="brandFormGroup" (ngSubmit)="submitForm()">
  <mat-dialog-content>
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>{{ "product__brand__name" | translate }}</mat-label>
      <input matInput type="text" formControlName="name" />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      type="submit"
      mat-stroked-button
      style="letter-spacing: 0"
      color="primary"
      [disabled]="isSubmitting || !brandFormGroup.valid"
    >
      {{ "product__brand__add__submit" | translate }}
    </button>
  </mat-dialog-actions>
</form>
