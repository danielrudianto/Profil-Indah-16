<nav class="sidenav" [class.sidenav--collapsed]="collapsed">
  <!--
    Brand ada di sini, bukan di topbar — mengikuti Nocturne. Sekaligus jalan
    pulang ke dashboard, peran yang dulu dipegang logo di topbar.

    Saat diciutkan hanya tanda gambarnya yang tersisa; namanya tidak muat pada
    lebar 76px dan memotongnya hanya menyisakan potongan huruf.
  -->
  <a class="sidenav__brand" routerLink="/" [title]="'Profil Indah'">
    <svg viewBox="0 0 48 48" class="sidenav__logo" aria-hidden="true">
      <path
        d="M7 41 V11 h18"
        fill="none"
        stroke="var(--color-accent)"
        stroke-width="5"
        stroke-linecap="round"
      ></path>
      <path
        d="M19 41 V23 h18"
        fill="none"
        stroke="var(--color-accent-base)"
        stroke-width="5"
        stroke-linecap="round"
      ></path>
      <circle cx="39" cy="13" r="4" fill="var(--color-accent)"></circle>
    </svg>
    <span class="sidenav__brand-name" *ngIf="!collapsed">Profil Indah</span>
  </a>

  <!--
    Pencarian disembunyikan saat diciutkan: kolom teks selebar 76px tidak bisa
    dipakai, dan menyisakannya hanya menghabiskan tinggi.
  -->
  <div class="sidenav__search" *ngIf="!collapsed">
    <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
    <input
      type="search"
      [formControl]="cariControl"
      [attr.placeholder]="'nav__search' | translate"
      [attr.aria-label]="'nav__search' | translate"
    />
  </div>

  <!--
    grup adalah FIELD, bukan getter. Memanggil getter dari sini membuat
    daftarnya dibangun ulang pada setiap pemeriksaan perubahan — lihat catatan
    panjang di sidenav.component.ts.
  -->
  <div class="sidenav__scroll">
    <div
      class="sidenav__group"
      *ngFor="let g of grup; trackBy: lacakGrup"
    >
      <div class="sidenav__group-head" *ngIf="!collapsed">
        <span>{{ g.label | translate }}</span>
        <span class="sidenav__count">{{ g.items.length }}</span>
      </div>

      <a
        class="sidenav__item"
        *ngFor="let entri of g.items; trackBy: lacakItem"
        [routerLink]="entri.jalur"
        routerLinkActive="sidenav__item--on"
        [title]="collapsed ? (entri.item.label | translate) : ''"
      >
        <i class="{{ entri.item.icon }}" aria-hidden="true"></i>
        <span class="sidenav__label" *ngIf="!collapsed">
          {{ entri.item.label | translate }}
        </span>
      </a>
    </div>

    <!--
      Terjadi ketika pencarian tidak menemukan apa pun. Tanpa pesan ini
      daftarnya hanya kosong, dan itu terbaca seperti menu yang gagal dimuat.
    -->
    <p class="sidenav__empty" *ngIf="grup.length === 0 && !collapsed">
      {{ 'nav__empty' | translate }}
    </p>
  </div>
</nav>
