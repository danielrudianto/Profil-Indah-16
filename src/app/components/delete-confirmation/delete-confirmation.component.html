<h1 mat-dialog-title>
  <span *ngIf="data.header == undefined">{{
    "general__delete-confirmation__title" | translate
  }}</span>

  <span *ngIf="data.header != undefined">{{ data.header | translate }}</span>
</h1>
<mat-dialog-content>
  <p>{{ data.title }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>
    {{ "general__delete-confirmation__close" | translate }}
  </button>
  <button
    mat-stroked-button
    color="primary"
    style="letter-spacing: 0"
    mat-dialog-close
    (click)="deleteDocument()"
  >
    {{ "general__delete-confirmation__submit" | translate }}
  </button>
</mat-dialog-actions>
