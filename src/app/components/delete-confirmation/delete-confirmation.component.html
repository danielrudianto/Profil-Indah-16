<div class="konfirmasi" role="alertdialog" aria-modal="true">
  <div class="konfirmasi__kepala">
    <span class="konfirmasi__ikon" aria-hidden="true">
      <i class="ph ph-warning"></i>
    </span>
    <h2 class="konfirmasi__judul">
      {{ (data.header ?? 'general__delete-confirmation__title') | translate }}
    </h2>
  </div>

  <p class="konfirmasi__pesan">{{ data.title }}</p>

  <!-- Nama dokumennya ditonjolkan — yang dihapus harus tersebut. -->
  <p class="konfirmasi__dokumen" *ngIf="data.document">
    {{ data.document }}
  </p>

  <div class="konfirmasi__aksi">
    <button type="button" class="btn btn--kedua" (click)="batal()">
      {{ 'general__delete-confirmation__close' | translate }}
    </button>
    <button type="button" class="btn btn--bahaya" (click)="setuju()">
      <i class="ph ph-trash" aria-hidden="true"></i>
      {{ 'general__delete-confirmation__submit' | translate }}
    </button>
  </div>
</div>
