<form [formGroup]="priceFormGroup" class="mt-3" (ngSubmit)="updatePrice()">
  <h1>
    {{ "update-product-sales-price__title" | translate }}
  </h1>
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>
      {{ "update-product-sales-price__price" | translate }}</mat-label
    >
    <input
      type="text"
      matInput
      type="text"
      mask="separator.2"
      thousandSeparator=" "
      formControlName="price"
      placeholder="Ex. 8 000"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>
      {{ "update-product-sales-price__discount" | translate }}</mat-label
    >
    <input
      type="text"
      matInput
      type="text"
      mask="separator.2"
      thousandSeparator=" "
      formControlName="discount"
      placeholder="Ex. 800"
    />
  </mat-form-field>

  <!-- Slide toggle, disabled if initialPrice is same with price -->
  <!--
    Hanya administrator (peran 5) dan pemilik (peran 7) yang boleh menimpa
    harga di master barang. Batas yang sama dijaga administratorMiddleware di
    server; ini sekadar tidak menawarkan pilihan yang pasti ditolak.
  -->
  <mat-slide-toggle
    class="w-100"
    *ngIf="bolehSimpanKeMaster"
    formControlName="save_price"
    [disabled]="
      (priceFormGroup.controls['initial_price'].value ===
        priceFormGroup.controls['price'].value &&
        this.priceFormGroup.controls['initial_discount'].value ===
          this.priceFormGroup.controls['discount'].value) ||
      priceFormGroup.invalid
    "
  >
    {{ "update-product-sales-price__save-price" | translate }}
  </mat-slide-toggle>

  <!-- Button to save -->
  <div class="update-price__button-wrapper">
    <button
      [disabled]="
        priceFormGroup.invalid ||
        priceFormGroup.controls['discount'].value >
          priceFormGroup.controls['price'].value
      "
      class="button-default"
      type="submit"
    >
      {{ "update-product-sales-price__save" | translate }}
    </button>
  </div>
</form>
