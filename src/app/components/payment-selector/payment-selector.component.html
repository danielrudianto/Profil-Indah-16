<div class="lembar">
  <!-- Pegangan — penanda bahwa lembar ini bisa diseret/ditutup ke bawah. -->
  <div class="lembar__grabber" aria-hidden="true"></div>

  <h1 class="lembar__judul">{{ "payment-selector__title" | translate }}</h1>

  <div class="metode" role="listbox">
    <button
      type="button"
      class="metode__baris"
      role="option"
      *ngFor="let payment of data"
      (click)="selectPayment(payment)"
    >
      <span class="metode__teks">
        <strong>{{ payment.name }}</strong>
        <small *ngIf="payment.description">{{ payment.description }}</small>
      </span>
      <i class="ph ph-caret-right metode__panah" aria-hidden="true"></i>
    </button>
  </div>
</div>
