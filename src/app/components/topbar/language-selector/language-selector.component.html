<!--
  Pil ID/EN sesuai Nocturne, menggantikan tombol bendera bermenu.

  Dua bahasa tidak perlu menu: menu menyembunyikan pilihan di balik satu klik
  tambahan dan tidak memperlihatkan bahasa yang sedang aktif tanpa dibuka.
-->
<div
  class="lang"
  [class.lang--en]="currentLang === 'en'"
  role="group"
  [attr.aria-label]="'language-selector__label' | translate"
>
  <span class="lang__thumb" aria-hidden="true"></span>

  <button
    type="button"
    class="lang__opt lang__opt--id"
    [attr.aria-pressed]="currentLang === 'id'"
    (click)="changeLanguage('id')"
  >
    ID
  </button>

  <button
    type="button"
    class="lang__opt lang__opt--en"
    [attr.aria-pressed]="currentLang === 'en'"
    (click)="changeLanguage('en')"
  >
    EN
  </button>
</div>
