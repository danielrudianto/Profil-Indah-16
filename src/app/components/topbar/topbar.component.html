<!--
  Topbar — sistem desain Nocturne.

  TIDAK ADA BRAND DI SINI. Logo dan nama toko pindah ke kepala navigasi
  samping, mengikuti desain: brand menandai aplikasinya, dan di Nocturne
  aplikasinya diwakili kolom kiri. Menaruhnya di dua tempat membuat baris ini
  penuh tanpa menambah keterangan apa pun.
-->
<header class="topbar">
  <button
    type="button"
    class="topbar__toggle"
    (click)="toggleSideNav()"
    [title]="'topbar__toggle_nav' | translate"
    [attr.aria-label]="'topbar__toggle_nav' | translate"
  >
    <i class="ph ph-list" aria-hidden="true"></i>
  </button>

  <!--
    Tag halaman yang sedang terbuka. Judulnya diturunkan dari alamat oleh
    PageTitleService, jadi halaman yang belum dikenali tidak memunculkan tag
    sama sekali — lebih baik kosong daripada menampilkan judul halaman
    sebelumnya.
  -->
  <a
    class="topbar__kembali"
    *ngIf="konteks?.kembaliLabel && konteks?.kembaliJalur"
    [routerLink]="konteks?.kembaliJalur"
  >
    <i class="ph ph-arrow-left" aria-hidden="true"></i>
    {{ konteks?.kembaliLabel! | translate }}
  </a>

  <span class="topbar__page" *ngIf="konteks?.tag || judulHalaman">
    <i class="ph-fill ph-bookmark-simple" aria-hidden="true"></i>
    {{ (konteks?.tag ?? judulHalaman)! | translate }}
  </span>

  <div class="topbar__utility">
    <app-dark-mode-selector />
    <app-language-selector />

    <!--
      Chip pengguna. Baris keduanya diisi PERAN, bukan surel seperti pada
      desain: catatan pengguna di sistem ini tidak menyimpan surel, dan peran
      justru keterangan yang berguna sejak menunya ikut menyesuaikan peran.
    -->
    <button
      type="button"
      class="topbar__user"
      [matMenuTriggerFor]="menuProfil"
      [attr.aria-label]="'topbar__profile' | translate"
    >
      <app-circle-avatar *ngIf="!isAvatarAvailable" [name]="name" [size]="30" />
      <app-avatar
        *ngIf="isAvatarAvailable"
        [width]="30"
        [top]="avatar.top"
        [accessories]="avatar.accessories"
        [circle]="avatar.circle"
        [color]="avatar.color"
        [eyebrows]="avatar.eyebrows"
        [eyes]="avatar.eyes"
        [mouth]="avatar.mouth"
        [clothes]="avatar.clothes"
      />

      <span class="topbar__user-text">
        <span class="topbar__user-name">{{ name }}</span>
        <span class="topbar__user-sub" *ngIf="subJudul">{{ subJudul }}</span>
      </span>

      <i class="ph ph-caret-down" aria-hidden="true"></i>
    </button>
  </div>
</header>

<!--
  Menu profil — mat-menu biasa, seanatomi menu aksi baris dan pemilih
  tahun. Kepalanya identitas (bukan item yang bisa diklik), lalu dua aksi.
-->
<mat-menu #menuProfil="matMenu" class="menu-profil" xPosition="before">
  <div class="menu-profil__kepala" (click)="$event.stopPropagation()">
    <app-circle-avatar *ngIf="!isAvatarAvailable" [name]="name" [size]="40" />
    <app-avatar
      *ngIf="isAvatarAvailable"
      [width]="40"
      [top]="avatar.top"
      [accessories]="avatar.accessories"
      [circle]="avatar.circle"
      [color]="avatar.color"
      [eyebrows]="avatar.eyebrows"
      [eyes]="avatar.eyes"
      [mouth]="avatar.mouth"
      [clothes]="avatar.clothes"
    />
    <div class="menu-profil__identitas">
      <strong>{{ name }}</strong>
      <span *ngIf="subJudul">{{ subJudul }}</span>
    </div>
  </div>

  <button mat-menu-item type="button" (click)="bukaPengaturan()">
    <i class="ph ph-gear" aria-hidden="true"></i>
    <span>{{ "nav__settings" | translate }}</span>
  </button>
  <button
    mat-menu-item
    type="button"
    class="menu-profil__keluar"
    (click)="logout()"
  >
    <i class="ph ph-sign-out" aria-hidden="true"></i>
    <span>{{ "profile-dialog__logout" | translate }}</span>
  </button>

  <!--
    Kaki menu: versi yang sedang berjalan. Ketika ada rilis lebih baru di
    server, barisnya BERUBAH menjadi tombol muat ulang — supaya tidak ada lagi
    yang perlu diberitahu satu per satu untuk menekan Ctrl+Shift+R.
  -->
  <div
    class="menu-profil__versi"
    *ngIf="versi && !adaVersiBaru"
    (click)="$event.stopPropagation()"
  >
    v{{ versi
    }}<span *ngIf="dibangun"> · {{ dibangun | date: "d MMM yyyy" }}</span>
  </div>

  <button
    mat-menu-item
    type="button"
    class="menu-profil__versi-baru"
    *ngIf="adaVersiBaru"
    (click)="muatUlang()"
  >
    <i class="ph ph-arrow-clockwise" aria-hidden="true"></i>
    <span>{{ "version__reload" | translate }}</span>
  </button>
</mat-menu>
