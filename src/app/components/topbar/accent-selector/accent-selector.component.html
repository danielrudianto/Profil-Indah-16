<!--
  Pemicunya tombol biasa berukuran 34px, sama dengan tombol ikon lain di
  topbar, bukan mat-icon-button — ukuran bawaan Material 40px membuat barisnya
  tidak sejajar.
-->
<button
  type="button"
  class="accent"
  [matMenuTriggerFor]="accentMenu"
  [title]="'accent-selector__tooltip' | translate"
  [attr.aria-label]="'accent-selector__tooltip' | translate"
>
  <span class="accent__preview" [style.background]="currentAccent.base"></span>
</button>

<mat-menu #accentMenu="matMenu">
  <button
    mat-menu-item
    class="accent__menu-item"
    *ngFor="let color of colors"
    (click)="changeAccent(color)"
  >
    <span
      class="accent__swatch"
      [class.accent__swatch--active]="color.label === currentAccent.label"
      [style.background]="color.base"
    ></span>
    {{ color.label | translate }}
  </button>
</mat-menu>
