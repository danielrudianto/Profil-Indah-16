<app-dynamic-dialog (backgroundClick)="closeDialog()" [isOpened]="isOpened">
  <!--
    Kartu Nocturne yang dilukis sendiri — pengganti create-dialog lama
    yang masih memakai ikon SVG biru dan tipografi Poppins.
  -->
  <div class="sales">
    <header class="sales__kepala">
      <span class="sales__ikon" aria-hidden="true">
        <i class="ph ph-identification-badge"></i>
      </span>
      <span class="sales__teks">
        <span class="sales__judul">
          {{ 'salesman-selector__title' | translate }}
        </span>
        <span class="sales__lede">
          {{ 'salesman-selector__lede' | translate }}
        </span>
      </span>
      <button
        type="button"
        class="sales__tutup"
        (click)="closeDialog()"
        [title]="'general__close' | translate"
        [attr.aria-label]="'general__close' | translate"
      >
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </header>

    <div class="sales__isi">
      <div class="sales__memuat" *ngIf="isLoading">
        <i class="ph ph-circle-notch sales__putar" aria-hidden="true"></i>
      </div>

      <ul class="sales__daftar" *ngIf="!isLoading">
        <li class="sales__baris" *ngFor="let nama of dataSource">
          <span class="avatar-inisial" aria-hidden="true">
            {{ inisial(nama) }}
          </span>
          <span class="sales__nama">{{ nama }}</span>
          <button
            type="button"
            class="sales__hapus"
            [disabled]="isSubmitting"
            (click)="deleteSalesman(nama)"
            [title]="'salesman-selector__delete' | translate"
            [attr.aria-label]="'salesman-selector__delete' | translate"
          >
            <i class="ph ph-trash" aria-hidden="true"></i>
          </button>
        </li>
      </ul>

      <p class="sales__kosong" *ngIf="!isLoading && dataSource.length === 0">
        {{ 'salesman-selector__empty' | translate }}
      </p>
    </div>

    <footer class="sales__kaki">
      <button type="button" class="btn btn--kedua" (click)="closeDialog()">
        {{ 'general__close' | translate }}
      </button>
    </footer>
  </div>
</app-dynamic-dialog>
