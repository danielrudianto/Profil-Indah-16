<app-dialog-shell
  icon="ph ph-credit-card"
  [heading]="'payment-method__update__title' | translate"
  [lede]="'payment-method__update__lede' | translate"
  [submitLabel]="'general__submit' | translate"
  [submitting]="isSubmitting"
  [canSubmit]="paymentMethodFormGroup.valid"
  (submitted)="submitForm()"
  (close)="closeDialog()"
>
  <div [formGroup]="paymentMethodFormGroup">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'payment-method__add__name' | translate }}</mat-label>
      <input matInput type="text" formControlName="name" autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'payment-method__add__description' | translate }}</mat-label>
      <textarea matInput rows="2" formControlName="description"></textarea>
    </mat-form-field>

    <!-- Penghapusan hanya untuk administrator. -->
    <button
      type="button"
      class="btn btn--bahaya btn--blok"
      [disabled]="!isAdministrator"
      (click)="delete()"
    >
      <i class="ph ph-trash" aria-hidden="true"></i>
      {{ 'payment-method__update__delete' | translate }}
    </button>
  </div>
</app-dialog-shell>
