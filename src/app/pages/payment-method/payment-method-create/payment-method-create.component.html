<app-dialog-shell
  icon="ph ph-credit-card"
  [heading]="'payment-method__add__title' | translate"
  [lede]="'payment-method__add__lede' | translate"
  [submitLabel]="'payment-method__add__submit' | translate"
  [submitting]="isSubmitting"
  [canSubmit]="paymentMethodFormGroup.valid"
  (submitted)="submitForm()"
  (close)="closeDialog()"
>
  <div [formGroup]="paymentMethodFormGroup">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'payment-method__add__name' | translate }}</mat-label>
      <input matInput type="text" formControlName="name" maxlength="100" autocomplete="off" placeholder="Ex. Transfer BCA" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'payment-method__add__description' | translate }}</mat-label>
      <textarea matInput rows="2" formControlName="description" placeholder="Ex. Transfer ke rekening BCA toko"></textarea>
    </mat-form-field>
  </div>
</app-dialog-shell>
