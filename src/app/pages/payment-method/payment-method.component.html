<app-list-page
  [heading]="'payment-method__title' | translate"
  [lede]="'payment-method__lede' | translate"
  [searchPlaceholder]="'payment-method__search' | translate"
  [addLabel]="'payment-method__add' | translate"
  [keyword]="keyword"
  [page]="page"
  [pageSize]="pageSize"
  [total]="dataCount"
  [loading]="isLoading"
  [showPageSize]="false"
  (search)="cari($event)"
  (pageChange)="bukaHalaman($event)"
  (add)="tambah()"
  (refresh)="ambilData()"
>
  <table class="tabel">
    <thead>
      <tr>
        <th>{{ "payment-method__name" | translate }}</th>
        <th>{{ "payment-method__description" | translate }}</th>
      </tr>
    </thead>

    <tbody *ngIf="!isLoading && dataSource.length > 0">
      <tr
        *ngFor="let item of dataSource; trackBy: lacakMetode"
        [class.tabel__baris-klik]="!!item.id"
        (click)="ubah(item)"
        tabindex="0"
        (keydown.enter)="ubah(item)"
        (keydown.space)="$event.preventDefault(); ubah(item)"
      >
        <td class="tabel__utama">{{ item.name }}</td>
        <td class="tabel__redup">{{ item.description }}</td>
      </tr>
    </tbody>

    <tbody *ngIf="isLoading">
      <tr>
        <td colspan="2" class="tabel__pesan">
          {{ "general__loading" | translate }}
        </td>
      </tr>
    </tbody>

    <tbody *ngIf="!isLoading && dataSource.length === 0">
      <tr>
        <td colspan="2">
          <app-tabel-kosong
            ikon="ph-credit-card"
            [judul]="'payment-method__empty__title' | translate"
            [penjelasan]="'payment-method__empty__desc' | translate"
            [kataKunci]="keyword"
            (reset)="resetPencarian()"
          />
        </td>
      </tr>
    </tbody>
  </table>
</app-list-page>
