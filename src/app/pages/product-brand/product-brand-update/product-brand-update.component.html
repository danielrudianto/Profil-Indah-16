<app-dialog-shell
  icon="ph ph-tag-simple"
  [heading]="'product__brand__update__title' | translate"
  [lede]="'product__brand__update__lede' | translate"
  [submitLabel]="'product__brand__update__submit' | translate"
  [submitting]="isSubmitting"
  [canSubmit]="!isLoading && brandFormGroup.valid"
  (submitted)="submitForm()"
  (close)="closeDialog()"
>
  <div class="medan" [formGroup]="brandFormGroup">
    <label for="ub-name">{{ 'product__brand__name' | translate }}</label>
    <input
      id="ub-name"
      class="medan__input"
      type="text"
      formControlName="name"
      autocomplete="off"
      [attr.disabled]="isLoading ? '' : null"
      [attr.placeholder]="
        (isLoading ? 'general__loading' : 'product__brand__add__example')
          | translate
      "
    />
  </div>
</app-dialog-shell>
