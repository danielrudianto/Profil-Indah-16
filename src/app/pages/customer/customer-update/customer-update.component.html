<app-dialog-shell
  icon="ph ph-users-three"
  [heading]="'customer__update__title' | translate"
  [lede]="'customer__update__lede' | translate"
  [submitLabel]="'general__submit' | translate"
  [submitting]="isSubmitting"
  [canSubmit]="customerFormGroup.valid"
  (submitted)="submitForm()"
  (close)="closeDialog()"
>
  <div [formGroup]="customerFormGroup">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'customer__add__name' | translate }}</mat-label>
      <input matInput type="text" formControlName="name" maxlength="100" autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'customer__add__address' | translate }}</mat-label>
      <textarea matInput rows="2" formControlName="address" maxlength="191"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'customer__add__npwp' | translate }}</mat-label>
      <input matInput type="text" mask="00.000.000.0-000.000" formControlName="npwp" autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'customer__add__pic' | translate }}</mat-label>
      <input matInput type="text" formControlName="pic" maxlength="100" autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'customer__add__phone_number' | translate }}</mat-label>
      <input matInput type="tel" inputmode="tel" formControlName="phone_number" maxlength="45" autocomplete="off" />
    </mat-form-field>

    <!--
      Tombol mati tanpa keterangan terbaca sebagai rusak. Alasannya
      ditulis: pelanggan yang sudah dipakai transaksi memang tidak boleh
      dihapus, dan itu keputusan sistem, bukan gangguan.
    -->
    <p
      class="petunjuk"
      *ngIf="!isLoading && customerFormGroup.get('can_delete')?.value === false"
    >
      <i class="ph ph-info" aria-hidden="true"></i>
      {{ "customer__update__undeletable" | translate }}
    </p>

    <!-- Dua penjaga: peran administrator dan can_delete dari server. -->
    <button
      type="button"
      class="btn btn--bahaya btn--blok"
      [disabled]="!isAdministrator || !customerFormGroup.get('can_delete')?.value"
      (click)="delete()"
    >
      <i class="ph ph-trash" aria-hidden="true"></i>
      {{ 'customer__update__delete' | translate }}
    </button>
  </div>
</app-dialog-shell>
