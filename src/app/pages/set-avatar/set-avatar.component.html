<!--
  Ubah avatar — bagian `21a` berkas desain.

  DIALOG DI TENGAH, bukan panel yang menggeser dari kanan. Seluruh pilihan lain
  di aplikasi ini sudah berupa dialog; panel samping membuat layar ini
  satu-satunya yang berperilaku sendiri.
-->
<div class="dialog-bungkus">
  <div class="dialog-latar" (click)="close()"></div>

  <div class="dialog" [@panelAnimation]="panelState" [formGroup]="avatarFormGroup">
    <header class="dialog__kepala">
      <div>
        <h2 class="dialog__judul">{{ 'set-avatar__title' | translate }}</h2>
        <p class="dialog__lede">{{ 'set-avatar__lede' | translate }}</p>
      </div>

      <button
        type="button"
        class="dialog__tutup"
        (click)="close()"
        [attr.aria-label]="'general__close' | translate"
      >
        <i class="ph ph-x" aria-hidden="true"></i>
      </button>
    </header>

    <!-- Pratinjau + lingkaran latar --------------------------------- -->
    <div class="pratinjau">
      <span class="pratinjau__lingkar" [style.background]="warnaLatar">
        <app-avatar
          [width]="96"
          [top]="avatarFormGroup.value.top"
          [accessories]="avatarFormGroup.value.accessories"
          [circle]="avatarFormGroup.value.circle"
          [color]="avatarFormGroup.value.color"
          [eyebrows]="avatarFormGroup.value.eyebrows"
          [eyes]="avatarFormGroup.value.eyes"
          [mouth]="avatarFormGroup.value.mouth"
          [clothes]="avatarFormGroup.value.clothes"
        />
      </span>

      <div class="pratinjau__atur">
        <mat-slide-toggle formControlName="circle">
          {{ 'set-avatar__circle' | translate }}
        </mat-slide-toggle>

        <!--
          Penggeser warna mati ketika lingkarannya dimatikan: warna latar yang
          tidak digambar tidak bisa diubah, dan menawarkannya membuat orang
          menggeser lalu bertanya kenapa tidak terjadi apa-apa.
        -->
        <div class="pratinjau__warna">
          <label>{{ 'set-avatar__circle-color' | translate }}</label>
          <app-color-picker
            [disabled]="!avatarFormGroup.value.circle"
            [selectedColor]="avatarFormGroup.value.color"
            (onColorSelected)="onColorSelected($event)"
          />
        </div>
      </div>
    </div>

    <!-- Tab per kelompok -------------------------------------------- -->
    <div class="tab" role="tablist">
      <button
        type="button"
        role="tab"
        class="tab__opt"
        *ngFor="let k of kelompok"
        [class.tab__opt--on]="kelompokAktif === k.kunci"
        [attr.aria-selected]="kelompokAktif === k.kunci"
        (click)="bukaKelompok(k.kunci)"
      >
        {{ k.label | translate }}
        <span class="tab__jumlah">{{ k.opsi.length }}</span>
      </button>
    </div>

    <!--
      Petak bergambar. Tiap opsi digambar utuh — bentuknya terbaca tanpa perlu
      dicoba satu per satu, dan itulah seluruh alasan layar ini dibangun ulang.
    -->
    <div class="petak" role="listbox">
      <button
        type="button"
        role="option"
        class="petak__opt"
        *ngFor="let n of kelompokTerbuka.opsi"
        [class.petak__opt--on]="terpilih(kelompokTerbuka.kunci, n)"
        [attr.aria-selected]="terpilih(kelompokTerbuka.kunci, n)"
        (click)="pilih(kelompokTerbuka.kunci, n)"
      >
        <span class="petak__lingkar" [style.background]="warnaLatar">
          <img [src]="gambar(kelompokTerbuka.kunci, n)" alt="" aria-hidden="true" />
        </span>
      </button>
    </div>

    <p class="petunjuk-hidup">
      <i class="ph ph-info" aria-hidden="true"></i>
      {{ 'set-avatar__live' | translate }}
    </p>

    <footer class="dialog__kaki">
      <button type="button" class="btn btn--kedua" (click)="close()">
        {{ 'general__cancel' | translate }}
      </button>
      <button
        type="button"
        class="btn btn--primary"
        [disabled]="isSubmitting"
        (click)="onSubmit()"
      >
        {{ 'set-avatar__save' | translate }}
      </button>
    </footer>
  </div>
</div>
