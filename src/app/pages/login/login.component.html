<div class="login">
  <!--
    Lingkaran dekoratif. Diletakkan di belakang konten dan tidak menerima
    peristiwa tetikus, sehingga tidak pernah menghalangi kolom isian.
    Warnanya mengikuti aksen yang sedang dipilih — lihat SettingsService.
  -->
  <div class="login__bloom" aria-hidden="true">
    <span class="login__bloom-a"></span>
    <span class="login__bloom-b"></span>
    <span class="login__bloom-c"></span>
  </div>

  <form class="login__card" [formGroup]="loginFormGroup" (ngSubmit)="login()">
    <div class="login__brand">
      <svg viewBox="0 0 48 48" class="login__logo" aria-hidden="true">
        <path
          d="M7 41 V11 h18"
          fill="none"
          stroke="var(--color-accent)"
          stroke-width="5"
          stroke-linecap="round"
        ></path>
        <!-- Versi redup dari aksen aktif; lihat catatan di sidenav. -->
        <path
          d="M19 41 V23 h18"
          fill="none"
          stroke="color-mix(in srgb, var(--color-accent) 55%, transparent)"
          stroke-width="5"
          stroke-linecap="round"
        ></path>
        <circle cx="39" cy="13" r="4" fill="var(--color-accent)"></circle>
      </svg>
      <div>
        <div class="login__brand-name">Profil Indah</div>
        <div class="login__brand-place">Bali · Indonesia</div>
      </div>
    </div>

    <h2 class="login__title">{{ 'login__welcome' | translate }}</h2>
    <p class="login__subtitle">{{ 'login__subtitle' | translate }}</p>

    <div class="field">
      <label for="l-user">{{ 'login__username' | translate }}</label>
      <div class="field__wrap">
        <i class="ph ph-user field__icon" aria-hidden="true"></i>
        <input
          id="l-user"
          class="input"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="nama.pengguna"
        />
      </div>
    </div>

    <div class="field">
      <label for="l-pass">{{ 'login__password' | translate }}</label>
      <div class="field__wrap">
        <i class="ph ph-lock-simple field__icon" aria-hidden="true"></i>
        <input
          id="l-pass"
          class="input input--with-action"
          [type]="isVisibilityOn ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
        />
        <!--
          Tombol, bukan ikon biasa: penekan tombol keyboard harus bisa
          mencapainya, dan pembaca layar perlu tahu keadaannya.
        -->
        <button
          type="button"
          class="field__action"
          [attr.aria-label]="
            (isVisibilityOn ? 'login__hide_password' : 'login__show_password')
              | translate
          "
          [attr.aria-pressed]="isVisibilityOn"
          (click)="isVisibilityOn = !isVisibilityOn"
        >
          <i
            class="ph"
            [class.ph-eye]="!isVisibilityOn"
            [class.ph-eye-slash]="isVisibilityOn"
          ></i>
        </button>
      </div>
    </div>

    <!--
      Tombol dinonaktifkan saat formulir belum lengkap atau permintaan sedang
      berjalan. Yang kedua mencegah pengiriman ganda ketika jaringan lambat —
      penekanan berulang menghasilkan beberapa permintaan login sekaligus.
    -->
    <button
      type="submit"
      class="btn btn--primary login__submit"
      [disabled]="loginFormGroup.invalid || isSubmitting"
    >
      {{ (isSubmitting ? 'login__submitting' : 'login__submit') | translate }}
    </button>

    <div class="login__foot">
      <span>{{ 'login__forgot' | translate }}</span>
      <div class="seg">
        <button
          type="button"
          class="seg__opt"
          [class.seg__opt--on]="currentLang === 'id'"
          (click)="changeLanguage('id')"
        >
          ID
        </button>
        <button
          type="button"
          class="seg__opt"
          [class.seg__opt--on]="currentLang === 'en'"
          (click)="changeLanguage('en')"
        >
          EN
        </button>
      </div>
    </div>
  </form>

  <div class="login__mascot">
    <div class="login__mascot-glow" aria-hidden="true"></div>
    <img
      src="assets/images/mascot-2d.png"
      alt=""
      aria-hidden="true"
      class="login__mascot-img"
    />
    <div class="login__mascot-caption">{{ 'login__caption' | translate }}</div>
  </div>
</div>
