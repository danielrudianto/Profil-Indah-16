<div class="login">
  <!--
    Lingkaran dekoratif. Diletakkan di belakang konten dan tidak menerima
    peristiwa tetikus, sehingga tidak pernah menghalangi kolom isian.
    Warnanya mengikuti aksen yang sedang dipilih — lihat SettingsService.
  -->
  <div class="login__bloom" aria-hidden="true">
    <span class="login__bloom-a"></span>
    <span class="login__bloom-b"></span>
    <span class="login__bloom-c"></span>

    <!--
      Lapis ornamen LATAR — pudar dan DIAM.

      Sebagian sengaja terpotong tepi layar: itu yang membuat ornamennya
      terbaca sebagai latar yang meluas keluar bingkai, bukan sebagai gambar
      kecil yang ditempel di dalamnya.

      Yang dirotasi dibungkus elemen tersendiri. Rotasinya ditulis di
      pembungkus supaya, bila suatu saat lapisan ini ikut dianimasikan,
      translateY tidak menimpa rotate — transform hanya punya satu nilai.
    -->
    <span class="orn-bg orn-bg--rock">
      <img src="assets/images/orn-rock.png" alt="" />
    </span>
    <span class="orn-bg orn-bg--graph">
      <img src="assets/images/orn-graph.png" alt="" />
    </span>
    <span class="orn-bg orn-bg--cone">
      <img src="assets/images/orn-cone.png" alt="" />
    </span>
  </div>

  <form class="login__card" [formGroup]="loginFormGroup" (ngSubmit)="login()">
    <!--
      Setengah bola di BELAKANG kartu, menyembul dari sudut kanan-atas.

      Ditaruh di dalam kartu, bukan di lapisan latar: dengan z-index negatif
      ia turun ke belakang latar kartunya sendiri, dan karena ikut kartu, ia
      menempel di tempat yang sama pada semua ukuran layar — bukan ditebak
      lewat persentase lebar viewport.
    -->
    <span class="login__sphere" aria-hidden="true">
      <img src="assets/images/orn-dome.png" alt="" />
    </span>
    <!-- Kembaran kecilnya menyembul di tepi kanan kartu, setinggi isian. -->
    <span class="login__sphere login__sphere--kanan" aria-hidden="true">
      <img src="assets/images/orn-dome.png" alt="" />
    </span>
    <div class="login__brand">
      <svg viewBox="0 0 48 48" class="login__logo" aria-hidden="true">
        <path
          d="M7 41 V11 h18"
          fill="none"
          stroke="var(--color-accent)"
          stroke-width="5"
          stroke-linecap="round"
        ></path>
        <!-- Versi redup dari aksen aktif; lihat catatan di sidenav. -->
        <path
          d="M19 41 V23 h18"
          fill="none"
          stroke="color-mix(in srgb, var(--color-accent) 55%, transparent)"
          stroke-width="5"
          stroke-linecap="round"
        ></path>
        <circle cx="39" cy="13" r="4" fill="var(--color-accent)"></circle>
      </svg>
      <div>
        <div class="login__brand-name">Profil Indah</div>
        <div class="login__brand-place">Bali · Indonesia</div>
      </div>
    </div>

    <h2 class="login__title">{{ 'login__welcome' | translate }}</h2>
    <p class="login__subtitle">{{ 'login__subtitle' | translate }}</p>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'login__username' | translate }}</mat-label>
      <!--
        Ikon dipasang lewat matPrefix, bukan menumpang di atas kolomnya:
        Material yang mengatur ruang untuknya, jadi teksnya tidak perlu diberi
        padding kiri yang ditebak sendiri.

        Keluarganya ikut Material, bukan Phosphor — di dalam mat-form-field,
        ikon Phosphor berdiri dengan garis dan berat yang berbeda dari ikon
        bawaan Material di sebelahnya, dan perbedaannya terbaca sebagai cacat.
      -->
      <mat-icon matPrefix>person</mat-icon>
      <input
        matInput
        type="text"
        formControlName="username"
        autocomplete="username"
        placeholder="nama.pengguna"
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'login__password' | translate }}</mat-label>
      <mat-icon matPrefix>lock</mat-icon>
      <input
        matInput
        [type]="isVisibilityOn ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        placeholder="••••••••"
      />
        <!--
          Tombol, bukan ikon biasa: penekan tombol keyboard harus bisa
          mencapainya, dan pembaca layar perlu tahu keadaannya.
        -->
        <button
          type="button"
          class="field__action"
          matSuffix
          [attr.aria-label]="
            (isVisibilityOn ? 'login__hide_password' : 'login__show_password')
              | translate
          "
          [attr.aria-pressed]="isVisibilityOn"
          (click)="isVisibilityOn = !isVisibilityOn"
        >
          <mat-icon>{{ isVisibilityOn ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
    </mat-form-field>

    <!--
      Tombol dinonaktifkan saat formulir belum lengkap atau permintaan sedang
      berjalan. Yang kedua mencegah pengiriman ganda ketika jaringan lambat —
      penekanan berulang menghasilkan beberapa permintaan login sekaligus.
    -->
    <button
      type="submit"
      class="btn btn--primary login__submit"
      [disabled]="loginFormGroup.invalid || isSubmitting"
    >
      {{ (isSubmitting ? 'login__submitting' : 'login__submit') | translate }}
    </button>

    <div class="login__foot">
      <span>{{ 'login__forgot' | translate }}</span>
      <div class="seg">
        <button
          type="button"
          class="seg__opt"
          [class.seg__opt--on]="currentLang === 'id'"
          (click)="changeLanguage('id')"
        >
          ID
        </button>
        <button
          type="button"
          class="seg__opt"
          [class.seg__opt--on]="currentLang === 'en'"
          (click)="changeLanguage('en')"
        >
          EN
        </button>
      </div>
    </div>
  </form>

  <div class="login__mascot">
    <div class="login__mascot-glow" aria-hidden="true"></div>

    <img
      src="assets/images/mascot-2d.png"
      alt=""
      aria-hidden="true"
      class="login__mascot-img"
    />

    <!--
      TANPA ornamen di sekeliling maskot — permintaan pemilik: gajahnya tidak
      boleh ditimpa apa pun. Percikan yang tampak di sekitarnya bagian dari
      gambar maskotnya sendiri. Semua ornamen halaman ada di lapis latar
      (.orn-bg) dan di balik kartu isian (.login__sphere).
    -->
    <div class="login__mascot-caption">{{ 'login__caption' | translate }}</div>
  </div>
</div>
