<app-dynamic-dialog (backgroundClick)="closeDialog()" [isOpened]="isOpened">
  <app-dialog-shell
    icon="ph ph-password"
    [heading]="'ganti-sandi__title' | translate"
    [lede]="'ganti-sandi__lede' | translate"
    [submitLabel]="'ganti-sandi__submit' | translate"
    [submitting]="isSubmitting"
    [canSubmit]="bolehKirim"
    (submitted)="submitForm()"
    (close)="closeDialog()"
  >
    <div [formGroup]="sandiFormGroup" class="sandi-form">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ "ganti-sandi__current" | translate }}</mat-label>
        <input
          matInput
          #input
          [type]="lihatSandi ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ "ganti-sandi__new" | translate }}</mat-label>
        <input
          matInput
          [type]="lihatSandi ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>{{ "ganti-sandi__confirm" | translate }}</mat-label>
        <input
          matInput
          [type]="lihatSandi ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
        />
      </mat-form-field>

      <!-- Konfirmasi yang tidak cocok diberi tahu SEBELUM tombol ditekan. -->
      <p class="sandi-form__selisih" *ngIf="konfirmasiBeda">
        {{ "ganti-sandi__mismatch" | translate }}
      </p>

      <button
        type="button"
        class="sandi-form__lihat"
        (click)="lihatSandi = !lihatSandi"
      >
        <i
          class="ph"
          [class.ph-eye]="!lihatSandi"
          [class.ph-eye-slash]="lihatSandi"
          aria-hidden="true"
        ></i>
        {{
          (lihatSandi ? "ganti-sandi__hide" : "ganti-sandi__show") | translate
        }}
      </button>
    </div>
  </app-dialog-shell>
</app-dynamic-dialog>
