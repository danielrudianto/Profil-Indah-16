<app-list-page
  [heading]="'receivable__title' | translate"
  [lede]="'receivable__lede' | translate"
  [searchPlaceholder]="'receivable__search' | translate"
  [keyword]="keyword"
  [page]="1"
  [pageSize]="tersaring.length || 1"
  [total]="tersaring.length"
  [loading]="isLoading"
  [showPageSize]="false"
  (search)="cari($event)"
  (refresh)="ambilData()"
>
  <table class="tabel">
    <thead>
      <tr>
        <th>{{ 'receivable__name' | translate }}</th>
        <th class="piutang__bar-kepala">
          <span class="sr-only">{{ 'receivable__amount' | translate }}</span>
        </th>
        <th class="tabel__nilai-kepala">
          {{ 'receivable__amount' | translate }}
        </th>
        <th class="tabel__aksi-kepala">
          <span class="sr-only">{{ 'general__actions' | translate }}</span>
        </th>
      </tr>
    </thead>

    <tbody *ngIf="!isLoading && tersaring.length > 0">
      <tr
        *ngFor="let item of tersaring; trackBy: lacakPiutang"
        class="tabel__baris-klik"
        (click)="lihat(item)"
      >
        <td class="tabel__utama">
          {{ item.name ?? ('sales-invoice__retail' | translate) }}
        </td>
        <!--
          Bar relatif terhadap penunggak terbesar — pola "penjualan per
          merek" di laporan. Angkanya tetap di kolom sebelah; bar hanya
          mempercepat perbandingan.
        -->
        <td
          class="piutang__bar-sel"
          [title]="(item.name ?? ('sales-invoice__retail' | translate)) + ' — Rp ' + (sisa(item) | number: '1.0-0')"
        >
          <span
            class="piutang__bar"
            [style.width.%]="lebarBar(item)"
            aria-hidden="true"
          ></span>
        </td>
        <td class="tabel__nilai baris__total">
          Rp {{ sisa(item) | number: '1.0-0' }}
        </td>
        <td class="tabel__aksi">
          <button
            type="button"
            class="tabel__aksi-btn"
            (click)="lihat(item)"
            [title]="'general__view' | translate"
            [attr.aria-label]="'general__view' | translate"
          >
            <i class="ph ph-caret-right" aria-hidden="true"></i>
          </button>
        </td>
      </tr>
    </tbody>

    <tbody *ngIf="isLoading">
      <tr>
        <td colspan="4" class="tabel__pesan">
          {{ 'general__loading' | translate }}
        </td>
      </tr>
    </tbody>

    <tbody *ngIf="!isLoading && tersaring.length === 0">
      <tr>
        <td colspan="4">
          <app-tabel-kosong
            ikon="ph-hand-coins"
            [judul]="'receivable__empty__title' | translate"
            [penjelasan]="'receivable__empty__desc' | translate"
            [kataKunci]="keyword"
            (reset)="resetPencarian()"
          />
        </td>
      </tr>
    </tbody>
  </table>
</app-list-page>
