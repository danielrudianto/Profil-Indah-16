<app-dialog-shell
  icon="ph ph-hand-coins"
  [heading]="'receivable-view__add-payment' | translate"
  [lede]="'receivable__payment__lede' | translate"
  [submitLabel]="'general__submit' | translate"
  [submitting]="isSubmitting"
  [canSubmit]="bisaSimpan"
  (submitted)="submit()"
  (close)="closeDialog()"
>
  <div [formGroup]="paymentFormGroup">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'receivable__payment__date' | translate }}</mat-label>
      <input
        matInput
        [matDatepicker]="bayarPicker"
        formControlName="date"
        autocomplete="off"
      />
      <!--
        Tombol kalender manual, bukan mat-datepicker-toggle: elemen toggle
        itu hilang tanpa jejak pada pipeline dev meski utuh di bundel
        produksi.
      -->
      <button
        type="button"
        matSuffix
        class="buka-kalender"
        (click)="bayarPicker.open()"
        [attr.aria-label]="'general__pick-date' | translate"
      >
        <i class="ph ph-calendar-blank" aria-hidden="true"></i>
      </button>
      <mat-datepicker #bayarPicker></mat-datepicker>
    </mat-form-field>

    <app-combo-search
      [label]="'receivable__payment__method' | translate"
      inputId="rc-metode"
      route="payment-method"
      [disabled]="isSubmitting"
      (pick)="pilihMetode($event)"
      (clear)="lepasMetode()"
    />

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'receivable__payment__amount' | translate }}</mat-label>
      <input
        matInput
        type="text"
        class="input--kanan"
        formControlName="value"
        mask="separator"
        thousandSeparator="."
        autocomplete="off"
        placeholder="0"
      />
    </mat-form-field>

    <p class="petunjuk">
      <i class="ph ph-info" aria-hidden="true"></i>
      <span>
        {{ 'receivable__payment__remaining' | translate }}
        Rp {{ data.max | number: '1.0-0' }}
      </span>
    </p>

    <mat-checkbox formControlName="full_payment">
      {{ 'receivable__payment__full' | translate }}
    </mat-checkbox>
  </div>
</app-dialog-shell>
