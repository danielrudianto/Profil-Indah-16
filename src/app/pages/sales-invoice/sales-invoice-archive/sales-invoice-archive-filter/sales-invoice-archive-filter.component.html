<app-dialog-shell
  icon="ph ph-funnel"
  [heading]="'sales-invoice__archive__filter__title' | translate"
  [lede]="'sales-invoice__archive__filter__lede' | translate"
  [submitLabel]="'general__save-filter' | translate"
  [canSubmit]="true"
  (submitted)="saveFilters()"
  (close)="close()"
>
  <div [formGroup]="salesInvoiceArchiveFilterFormGroup">
    <mat-form-field class="w-100" appearance="outline">
      <mat-label>{{
        "sales-invoice__archive__filter__date-range" | translate
      }}</mat-label>
      <mat-date-range-input
        [rangePicker]="picker"
        [min]="minDate"
        [max]="maxDate"
      >
        <input
          matStartDate
          formControlName="startDate"
          [placeholder]="'general__date-start' | translate"
        />
        <input
          matEndDate
          formControlName="endDate"
          [placeholder]="'general__date-end' | translate"
        />
      </mat-date-range-input>

      <!--
        Tombol kalender manual, bukan mat-datepicker-toggle: elemen toggle itu
        hilang tanpa jejak pada pipeline dev meski utuh di bundel produksi.
      -->
      <button
        type="button"
        matSuffix
        class="buka-kalender"
        (click)="picker.open()"
        [attr.aria-label]="'general__pick-date' | translate"
      >
        <i class="ph ph-calendar-blank" aria-hidden="true"></i>
      </button>

      <mat-date-range-picker #picker [startAt]="minDate" />
    </mat-form-field>

    <!--
      Petunjuk formatnya dihapus, bukan diterjemahkan. Bunyinya
      "MM/DD/YYYY - MM/DD/YYYY" — urutan Amerika, pada aplikasi yang
      menggambar tanggalnya sebagai 30/8/2026. Petunjuk yang salah lebih
      buruk daripada tidak ada petunjuk, dan kolomnya diisi lewat kalender.
    -->

    <section class="saring__bagian">
      <h3 class="saring__label">
        {{ "sales-invoice__archive__filter__document-status" | translate }}
      </h3>

      <div class="saring__pilihan">
        <button
          type="button"
          class="saring__pil"
          [class.saring__pil--on]="filterObject.isActive"
          [attr.aria-pressed]="filterObject.isActive"
          (click)="alih('isActive')"
        >
          <i class="ph ph-check-circle" aria-hidden="true"></i>
          {{
            "sales-invoice__archive__filter__document-status__active"
              | translate
          }}
        </button>

        <button
          type="button"
          class="saring__pil"
          [class.saring__pil--on]="filterObject.isDelete"
          [attr.aria-pressed]="filterObject.isDelete"
          (click)="alih('isDelete')"
        >
          <i class="ph ph-trash" aria-hidden="true"></i>
          {{
            "sales-invoice__archive__filter__document-status__deleted"
              | translate
          }}
        </button>
      </div>
    </section>

    <section class="saring__bagian">
      <h3 class="saring__label">
        {{ "sales-invoice__archive__filter__payment-status" | translate }}
      </h3>

      <div class="saring__pilihan">
        <button
          type="button"
          class="saring__pil"
          [class.saring__pil--on]="filterObject.isPaid"
          [attr.aria-pressed]="filterObject.isPaid"
          (click)="alih('isPaid')"
        >
          <i class="ph ph-check-circle" aria-hidden="true"></i>
          {{
            "sales-invoice__archive__filter__payment-status__paid" | translate
          }}
        </button>

        <button
          type="button"
          class="saring__pil"
          [class.saring__pil--on]="filterObject.isUnpaid"
          [attr.aria-pressed]="filterObject.isUnpaid"
          (click)="alih('isUnpaid')"
        >
          <i class="ph ph-clock-countdown" aria-hidden="true"></i>
          {{
            "sales-invoice__archive__filter__payment-status__unpaid" | translate
          }}
        </button>
      </div>
    </section>

    <!--
      Tidak memilih apa pun berarti tidak menyaring, bukan tidak ada hasil.
      Dikatakan di layar karena dua pil yang sama-sama padam mudah terbaca
      sebagai "semuanya dimatikan" — dan orangnya lalu mengira daftarnya
      akan kosong.
    -->
    <p class="petunjuk" *ngIf="tanpaSaringan">
      <i class="ph ph-info" aria-hidden="true"></i>
      <span>{{ "sales-invoice__archive__filter__all" | translate }}</span>
    </p>
  </div>
</app-dialog-shell>
