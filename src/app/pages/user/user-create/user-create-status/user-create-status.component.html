<app-dialog-shell
  icon="ph ph-key"
  [heading]="'user__status__title' | translate"
  [lede]="'user__status__lede' | translate"
  [submitLabel]="'user__status__done' | translate"
  [canSubmit]="true"
  (submitted)="selesai()"
  (close)="selesai()"
>
  <dl class="ringkas">
    <div *ngFor="let b of baris">
      <dt>{{ b.kunci | translate }}</dt>
      <dd>{{ b.nilai }}</dd>
    </div>
  </dl>

  <!-- Kata sandinya MENCOLOK — inilah alasan dialog ini ada. -->
  <div class="sandi">
    <span class="sandi__label">{{ 'user__status__password' | translate }}</span>
    <code class="sandi__nilai">{{ data?.password }}</code>
  </div>

  <button type="button" class="btn btn--kedua btn--blok" (click)="salin()">
    <i class="ph ph-copy" aria-hidden="true"></i>
    {{ 'user__status__copy' | translate }}
  </button>
</app-dialog-shell>
