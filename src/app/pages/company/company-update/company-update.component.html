<app-dialog-shell
  icon="ph ph-buildings"
  [heading]="'company__update__title' | translate"
  [lede]="'company__update__lede' | translate"
  [submitLabel]="'general__submit' | translate"
  [submitting]="isSubmitting"
  [canSubmit]="companyFormGroup.valid"
  (submitted)="submitForm()"
  (close)="closeDialog()"
>
  <div [formGroup]="companyFormGroup">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'company__update__name' | translate }}</mat-label>
      <input matInput type="text" formControlName="name" maxlength="50" autocomplete="off" placeholder="Ex. PT. ABC" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'company__update__address' | translate }}</mat-label>
      <textarea matInput rows="2" formControlName="address" placeholder="Ex. Jalan Raya ABC no. XX"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ 'company__update__npwp' | translate }}</mat-label>
      <input matInput type="text" mask="00.000.000.0-000.000" formControlName="npwp" autocomplete="off" placeholder="Ex. XX.XXX.XXX.X-XXX.XXX" />
    </mat-form-field>

    <!--
      Hapus dibatasi dua penjaga sekaligus: peran administrator, dan can_delete
      dari server — perusahaan yang pernah dipakai dokumen tidak boleh hilang.
    -->
    <button
      type="button"
      class="btn btn--bahaya btn--blok"
      [disabled]="!isAdministrator || !companyFormGroup.get('can_delete')?.value"
      (click)="delete()"
    >
      <i class="ph ph-trash" aria-hidden="true"></i>
      {{ 'company__update__delete' | translate }}
    </button>
  </div>
</app-dialog-shell>
