<!--
  Daftar perusahaan.

  Ukuran halaman ditentukan server lewat process.env.LIMIT dan tidak bisa
  diminta lain, jadi pilihan 10/25/50 dimatikan — menawarkan pilihan yang tidak
  berpengaruh membuat pengguna mengira daftarnya rusak ketika ditekan dan tidak
  terjadi apa-apa.
-->
<app-list-page
  [heading]="'company__title' | translate"
  [lede]="'company__lede' | translate"
  [searchPlaceholder]="'company__search' | translate"
  [addLabel]="'company__add' | translate"
  [keyword]="keyword"
  [page]="page"
  [pageSize]="pageSize"
  [total]="dataCount"
  [loading]="isLoading"
  [showPageSize]="false"
  (search)="cari($event)"
  (pageChange)="bukaHalaman($event)"
  (add)="tambah()"
  (refresh)="ambilData()"
>
  <table class="tabel">
    <thead>
      <tr>
        <th>{{ 'company__name' | translate }}</th>
        <th>{{ 'company__address' | translate }}</th>
        <th>{{ 'company__npwp' | translate }}</th>
        <th class="tabel__aksi-kepala">
          <span class="sr-only">{{ 'general__actions' | translate }}</span>
        </th>
      </tr>
    </thead>

    <tbody *ngIf="!isLoading && dataSource.length > 0">
      <tr
        *ngFor="let item of dataSource; trackBy: lacakPerusahaan"
        class="tabel__baris-klik"
        (click)="ubah(item)"
      >
        <td class="tabel__utama">{{ item.name }}</td>
        <td class="tabel__redup">{{ item.address }}</td>
        <!--
          NPWP tanpa isi bukan kesalahan — tidak semua perusahaan punya, dan
          em dash menyatakan itu lebih tenang daripada "N/A".
        -->
        <td>
          {{ item.npwp ? (item.npwp | mask: '00.000.000.0-000.000') : '—' }}
        </td>
        <td class="tabel__aksi" (click)="$event.stopPropagation()">
          <!-- Laporan bulanan: keluar-masuk stok milik badan usaha ini. -->
          <button
            type="button"
            class="tabel__aksi-btn"
            (click)="laporan(item)"
            [title]="'company-report__title' | translate"
            [attr.aria-label]="'company-report__title' | translate"
          >
            <i class="ph ph-chart-bar" aria-hidden="true"></i>
          </button>
          <button
            type="button"
            class="tabel__aksi-btn"
            (click)="ubah(item)"
            [title]="'general__edit' | translate"
            [attr.aria-label]="'general__edit' | translate"
          >
            <i class="ph ph-pencil-simple" aria-hidden="true"></i>
          </button>
        </td>
      </tr>
    </tbody>

    <tbody *ngIf="isLoading">
      <tr>
        <td colspan="4" class="tabel__pesan">
          {{ 'general__loading' | translate }}
        </td>
      </tr>
    </tbody>

    <tbody *ngIf="!isLoading && dataSource.length === 0">
      <tr>
        <td colspan="4">
          <app-tabel-kosong
            ikon="ph-buildings"
            [judul]="'company__empty__title' | translate"
            [penjelasan]="'company__empty__desc' | translate"
            [kataKunci]="keyword"
            (reset)="resetPencarian()"
          />
        </td>
      </tr>
    </tbody>
  </table>
</app-list-page>
