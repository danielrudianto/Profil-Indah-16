<mat-drawer-container class="dashboard h-100">

  <mat-drawer
    [mode]="drawerMode"
    [opened]="isSideNavOpen$ | async"
    class="dashboard__drawer"
  >
    <app-sidenav />
  </mat-drawer>

  <!--
    Lapisan dekoratif berblur besar, di lapis PALING BAWAH.

    Pernah dicabut karena disangka membuat halaman berhenti tergambar. Dugaan
    itu KELIRU: penyebabnya aturan position: relative yang dulu dipasang pada
    mat-drawer demi menaikkan z-index — drawer keluar dari penempatan absolut
    Material dan tingginya sendiri mendorong seluruh isi shell ke luar layar.
    Blurnya tidak bersalah.

    Karena itu urutannya kini diatur lewat z-index pada lapisan ini saja, dan
    position milik Material tidak disentuh sama sekali.
  -->
  <mat-drawer-content>
    <!--
      Di DALAM mat-drawer-content, bukan sebagai anak langsung containernya:
      mat-drawer-container hanya memproyeksikan mat-drawer dan
      mat-drawer-content — anak lain dibuang tanpa peringatan, dan itulah
      sebabnya lapisan ini sempat tidak pernah muncul di DOM.

      mat-drawer-content sudah position: relative dari Material sendiri, jadi
      lapisan absolutnya menempel ke situ tanpa menyentuh apa pun.
    -->
    <app-page-bloom />

    <app-topbar />

    <main class="dashboard__body">
      <!--
        Sapaan hanya muncul ketika outlet-nya kosong, yaitu di dashboard itu
        sendiri. Halaman anak seperti /Settings punya judulnya sendiri, dan
        menumpuk sapaan di atasnya membuat halaman itu seperti sisipan, bukan
        halaman utuh.
      -->
      <ng-container *ngIf="!adaAnak">
        <h1 class="dashboard__greeting">
          {{ 'dashboard__greeting' | translate }}{{ nama ? ', ' + nama : '' }}
        </h1>

        <!--
          Peran tanpa subpohon sendiri diberi tahu apa adanya, bukan dibiarkan
          menatap layar kosong yang terbaca seperti aplikasi gagal dimuat.
        -->
        <p class="dashboard__empty" *ngIf="!punyaNavigasi">
          {{ 'dashboard__no_access' | translate }}
        </p>
      </ng-container>

      <router-outlet />
    </main>
  </mat-drawer-content>
</mat-drawer-container>
