<app-dialog-shell
  icon="ph ph-receipt-x"
  [heading]="'expense__add__title' | translate"
  [lede]="'expense__add__lede' | translate"
  [submitLabel]="'expense__add__submit' | translate"
  [submitting]="isSubmitting"
  [canSubmit]="expenseFormGroup.valid"
  (submitted)="submitForm()"
  (close)="closeDialog()"
>
  <div [formGroup]="expenseFormGroup">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ "expense__create__date" | translate }}</mat-label>
      <input
        matInput
        [matDatepicker]="expPicker"
        formControlName="date"
        (click)="expPicker.open()"
      />
      <!--
        Tombol kalender manual, bukan mat-datepicker-toggle: elemen toggle itu
        hilang tanpa jejak pada pipeline dev meski utuh di bundel produksi.
      -->
      <button
        type="button"
        matSuffix
        class="buka-kalender"
        (click)="expPicker.open()"
        [attr.aria-label]="'general__pick-date' | translate"
      >
        <i class="ph ph-calendar-blank" aria-hidden="true"></i>
      </button>
      <mat-datepicker #expPicker></mat-datepicker>
    </mat-form-field>

    <app-combo-search
      [label]="'expense__create__type' | translate"
      inputId="exp-type"
      route="expense-type"
      [disabled]="isSubmitting"
      (pick)="onSelectExpenseType($event)"
      (clear)="onUnselectExpenseType()"
    />

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ "expense__create__description" | translate }}</mat-label>
      <textarea matInput rows="2" formControlName="description"></textarea>
    </mat-form-field>

    <app-combo-search
      [label]="'expense__create__company' | translate"
      inputId="exp-company"
      route="company"
      [disabled]="isSubmitting"
      (pick)="onSelectCompany($event)"
      (clear)="onUnselectCompany()"
    />

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>{{ "expense__create__value" | translate }}</mat-label>
      <input
        matInput
        type="text"
        class="input--kanan"
        mask="separator.2"
        thousandSeparator="."
        decimalMarker=","
        formControlName="value"
        autocomplete="off"
      />
      <span matTextPrefix>Rp&nbsp;</span>
    </mat-form-field>
  </div>
</app-dialog-shell>
