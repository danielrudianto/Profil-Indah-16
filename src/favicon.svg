<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!--
    Favicon: tanda yang sama dengan logo sidebar (sidenav.component.html),
    tetapi PUTIH di atas ubin aksen, bukan aksen di atas latar bening.

    Alasannya ukuran. Pada 16 piksel, goresan setebal 5 unit di atas latar
    bening menipis menjadi nyaris tak terlihat, dan warnanya bertabrakan
    dengan bilah tab yang bisa terang atau gelap. Ubin pekat memberi kontras
    yang sama di kedua keadaan.

    Warnanya #154dec — aksen BAWAAN. Favicon tidak bisa membaca pilihan aksen
    pengguna: ia berkas statis yang dimuat peramban di luar aplikasi.
  -->
  <rect width="48" height="48" rx="11" fill="#154dec"/>
  <g transform="translate(24 24) scale(0.82) translate(-24 -24)"
     fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <path d="M7 41 V11 h18"/>
    <path d="M19 41 V23 h18" stroke-opacity="0.62"/>
  </g>
  <circle cx="36.3" cy="14.7" r="3.3" fill="#ffffff"/>
</svg>
